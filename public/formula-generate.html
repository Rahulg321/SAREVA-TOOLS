<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formula Generator · Sareva Finance Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Sareva Finance Tools — free finance calculators and AI utilities for screening, valuation, returns and CIM analysis." />
</head>
<body>
  <main class="card wide">
    <header>
      <div>
        <p class="eyebrow">AI</p>
        <h1>Formula Generator</h1>
      </div>
      <a class="link" href="/">&larr; All tools</a>
    </header>
    <p class="lead">Describe what you need and get a spreadsheet formula.</p>

    <form id="tool" data-endpoint="/api/formula-generate">
      <label>Description
        <textarea name="description" rows="3" spellcheck="false">3-year CAGR from beginning to ending value</textarea>
      </label>
      <button type="submit">Generate</button>
    </form>

    <section id="result" hidden></section>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/lib.js"></script>
  <script src="/tool.js"></script>
  <script src="/config.js"></script>
  <script src="/ai.js"></script>
  <footer class="site-footer"><a href="/">Sareva Finance Tools</a><span>tools.sareva.in</span></footer>
</body>
</html>
