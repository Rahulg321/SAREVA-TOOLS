<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formula Explainer · Finance Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="card wide">
    <header>
      <div>
        <p class="eyebrow">AI</p>
        <h1>Formula Explainer</h1>
      </div>
      <a class="link" href="/">&larr; All tools</a>
    </header>
    <p class="lead">Paste a spreadsheet formula and get a plain-English explanation.</p>

    <form id="tool" data-endpoint="/api/formula-explain">
      <label>Formula
        <textarea name="formula" rows="3" spellcheck="false">=IFERROR((E27-D27)/D27,0)</textarea>
      </label>
      <button type="submit">Explain</button>
    </form>

    <section id="result" hidden></section>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/lib.js"></script>
  <script src="/tool.js"></script>
  <script src="/ai.js"></script>
</body>
</html>
