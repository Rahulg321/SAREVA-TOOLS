<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reverse Returns · Sareva Finance Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Sareva Finance Tools — free finance calculators and AI utilities for screening, valuation, returns and CIM analysis." />
</head>
<body>
  <main class="card wide">
    <header>
      <div>
        <p class="eyebrow">Valuation</p>
        <h1>Reverse Returns</h1>
      </div>
      <a class="link" href="/">&larr; All tools</a>
    </header>
    <p class="lead">What exit value do you need to hit a target IRR?</p>

    <form id="tool" data-endpoint="/api/reverse-returns">
      <label>Entry Enterprise Value ($)
        <input name="entry_ev" type="number" step="any" value="100000000" required />
      </label>
      <label>Entry Debt ($)
        <input name="entry_debt" type="number" step="any" value="40000000" required />
      </label>
      <label>Assumed Exit Debt ($)
        <input name="exit_debt" type="number" step="any" value="20000000" required />
      </label>
      <label>Hold Period (years)
        <input name="hold_years" type="number" step="any" value="5" required />
      </label>
      <label>Target IRR (decimal, e.g. 0.25)
        <input name="target_irr" type="number" step="any" value="0.25" required />
      </label>
      <button type="submit">Calculate</button>
    </form>

    <section id="result" hidden></section>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/lib.js"></script>
  <script src="/tool.js"></script>
  <footer class="site-footer"><a href="/">Sareva Finance Tools</a><span>tools.sareva.in</span></footer>
</body>
</html>
