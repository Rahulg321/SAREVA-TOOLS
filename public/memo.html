<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Investment Memo Generator · Sareva Finance Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Sareva Finance Tools — free finance calculators and AI utilities for screening, valuation, returns and CIM analysis." />
</head>
<body>
  <main class="card wide">
    <header>
      <div>
        <p class="eyebrow">AI</p>
        <h1>Investment Memo Generator</h1>
      </div>
      <a class="link" href="/">&larr; All tools</a>
    </header>
    <p class="lead">Turn a company description, financials and notes into a one-page IC-style memo.</p>

    <form id="tool" data-endpoint="/api/memo">
      <label>Upload a CIM (PDF)
        <input type="file" accept="application/pdf" data-pdf />
        <span id="file-status" class="hint">Text-based PDFs only.</span>
      </label>
      <label>Company description, financials &amp; notes
        <textarea name="text" rows="8" spellcheck="false">Paste the company description, financials and notes here.</textarea>
      </label>
      <button type="submit">Generate memo</button>
    </form>

    <section id="result" hidden></section>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/lib.js"></script>
  <script src="/tool.js"></script>
  <script src="/pdftext.js"></script>
  <script src="/config.js"></script>
  <script src="/ai.js"></script>
  <footer class="site-footer"><a href="/">Sareva Finance Tools</a><span>tools.sareva.in</span></footer>
</body>
</html>
