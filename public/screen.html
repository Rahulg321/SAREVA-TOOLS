<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deal Screener · Sareva Finance Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Sareva Finance Tools — free finance calculators and AI utilities for screening, valuation, returns and CIM analysis." />
</head>
<body>
  <main class="card wide">
    <header>
      <div>
        <p class="eyebrow">Screening</p>
        <h1>Deal Screener</h1>
      </div>
      <div class="header-actions">
        <span id="status" class="status" role="status" aria-label="API status" title="API status">&#9679;</span>
        <a class="link" href="/">&larr; All tools</a>
      </div>
    </header>
    <p class="lead">Screen a deal against your firm's investment mandate. The mandate is saved in this browser.</p>

    <ol class="steps">
      <li id="tab-1" class="step-tab active">1 · Mandate</li>
      <li id="tab-2" class="step-tab">2 · Deal</li>
    </ol>

    <form id="mandate" class="step-panel">
      <label>Revenue minimum ($)
        <input name="revenue_min" type="number" step="any" placeholder="Any" />
      </label>
      <label>Revenue maximum ($)
        <input name="revenue_max" type="number" step="any" placeholder="Any" />
      </label>
      <label>Minimum EBITDA ($)
        <input name="ebitda_min" type="number" step="any" placeholder="Any" />
      </label>
      <label>Minimum EBITDA margin (%)
        <input name="min_ebitda_margin" type="number" step="any" value="10" />
      </label>
      <label>Minimum revenue growth (%)
        <input name="min_growth" type="number" step="any" value="5" />
      </label>
      <label>Maximum net debt / EBITDA (x)
        <input name="max_net_debt_to_ebitda" type="number" step="any" value="4" />
      </label>
      <div class="actions">
        <button type="submit">Save &amp; continue</button>
        <button type="button" id="reset-mandate" class="secondary">Reset defaults</button>
      </div>
    </form>

    <form id="deal" class="step-panel" hidden>
      <label>Company name
        <input name="name" type="text" value="Acme Corp" />
      </label>
      <label>Revenue ($)
        <input name="revenue" type="number" step="any" value="50000000" required />
      </label>
      <label>EBITDA ($)
        <input name="ebitda" type="number" step="any" value="11000000" required />
      </label>
      <label>Growth (%)
        <input name="growth" type="number" step="any" value="25" required />
      </label>
      <label>Debt ($)
        <input name="debt" type="number" step="any" value="20000000" required />
      </label>
      <div class="actions">
        <button type="submit">Screen deal</button>
        <button type="button" id="edit-mandate" class="secondary">Edit mandate</button>
      </div>
    </form>

    <section id="result" hidden></section>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
