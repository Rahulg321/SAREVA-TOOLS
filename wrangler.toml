name = "finance-tools"
main = "build/index.js"
compatibility_date = "2026-09-30"

[build]
command = "bash scripts/build-worker.sh"

[assets]
directory = "./public"

[vars]
TURNSTILE_HOSTNAMES = "tools.sareva.in"

[ai]
binding = "AI"
remote = true

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 20
  period = 60
