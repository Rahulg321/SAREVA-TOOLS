[package]
name = "finance-tools"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
worker = { version = "=0.8.6", features = ["http", "axum"] }
worker-macros = { version = "=0.8.6", features = ["http"] }
axum = { version = "0.8", default-features = false, features = ["json"] }
tower-service = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
